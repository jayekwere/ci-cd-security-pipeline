# DAST - OWASP ZAP (Dockerized). Runs a passive baseline scan, then an active scan,
# against an authorized running target. DAST records HTTP alerts; SAST examines code-level
# risk. Findings require manual validation before an exploitability claim.
#
# Set TARGET_URL to a deployed staging instance or a service started in this job.
# Note: traditional spidering misses dynamically-loaded SPA/API endpoints - for SPAs,
# import an OpenAPI spec and run with auth context (see README "What I'd build next").

name: dast-zap

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (passive)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ github.event.inputs.target_url }}
          allow_issue_writing: false
          # Triage passive findings by exploitability - missing CSP/security headers,
          # CORS misconfig, cache-control - and filter passive false positives
          # (e.g. CSS timestamp pattern-matches).
          cmd_options: "-a"

  zap-full:
    name: ZAP full (active)
    runs-on: ubuntu-latest
    needs: zap-baseline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ZAP full active scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: ${{ github.event.inputs.target_url }}
          allow_issue_writing: false
