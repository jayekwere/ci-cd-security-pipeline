# Manual scans are restricted to a disposable runner-local static target.
name: dast-zap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (passive)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start disposable local target
        run: |
          python3 app/server.py > /tmp/dast-server.log 2>&1 &
          for _attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          # Triage passive findings by exploitability - missing CSP/security headers,
          # CORS misconfig, cache-control - and filter passive false positives
          # (e.g. CSS timestamp pattern-matches).
          cmd_options: "-a"

  zap-full:
    name: ZAP full (active)
    runs-on: ubuntu-24.04
    needs: zap-baseline
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start disposable local target
        run: |
          python3 app/server.py > /tmp/dast-server.log 2>&1 &
          for _attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: ZAP full active scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
