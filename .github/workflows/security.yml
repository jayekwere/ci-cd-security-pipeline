name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch trusted tests from protected base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          mkdir -p /tmp/trusted-tests
          for file in test_gate.py test_gate_cli.py test_delivery.py test_secrets.py; do
            git show "$BASE_SHA:tests/$file" > "/tmp/trusted-tests/$file"
          done
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -m unittest discover -s /tmp/trusted-tests -v
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Gate regression tests
        run: python -m unittest discover -v
      - name: Scan the actual demonstration source
        run: |
          mkdir -p artifacts
          semgrep scan --config p/default --config p/security-audit --config policy/semgrep.yml --strict --metrics=off --disable-version-check --json --output artifacts/semgrep.json app
          python scripts/gate.py --report artifacts/semgrep.json --baseline policy/sast-baseline.json --require-target app/vuln.py
      - name: Reject new unsafe code and absent scan evidence
        run: bash scripts/check-negative-gate.sh
      - name: Block vulnerable resolved application dependencies
        run: pip-audit --requirement app/requirements.txt --no-deps --disable-pip --format json --output artifacts/dependency-audit.json
      - name: Reject isolated vulnerable dependency
        run: bash scripts/check-negative-dependency.sh
      - name: Retain reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-evidence-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_secrets.py
      - name: Block verified credentials in history
        uses: trufflesecurity/trufflehog@421026a6540c63cf143ef53a5859389d473e88da
        with:
          extra_args: --only-verified
          version: latest@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/delivery.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-evidence
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 14
  gate:
    if: always()
    needs: [scans, secrets, build, independent-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every blocking job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/delivery.py accept "$RESULTS"
