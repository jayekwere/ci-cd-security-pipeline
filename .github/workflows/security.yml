name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Gate regression tests
        run: python -m unittest discover -v
      - name: Scan the actual demonstration source
        run: |
          mkdir -p artifacts
          semgrep scan --config p/default --config p/security-audit --config policy/semgrep.yml --strict --metrics=off --disable-version-check --json --output artifacts/semgrep.json app
          python scripts/gate.py --report artifacts/semgrep.json --baseline policy/sast-baseline.json --require-target app/vuln.py
      - name: Reject new unsafe code and absent scan evidence
        run: bash scripts/check-negative-gate.sh
      - name: Block vulnerable resolved application dependencies
        run: pip-audit --requirement app/requirements.txt --no-deps --disable-pip --format json --output artifacts/dependency-audit.json
      - name: Retain reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-evidence-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block verified credentials in history
        uses: trufflesecurity/trufflehog@ce76ea8f54888c154de94d37f0681493e69193f8
        with:
          extra_args: --only-verified
          version: latest@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
  gate:
    if: always()
    needs: [scans, secrets]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every blocking job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          print('PASS every required scanner and regression check succeeded')
          PY
