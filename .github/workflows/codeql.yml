# CodeQL - semantic (data-flow / taint) SAST.
# Catches cross-function source-to-sink flows that pattern matching misses
# (worked example: docs/findings/cwe-78-command-injection.md, implemented in app/vuln.py).

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch newly-published queries against old code

permissions:
  contents: read

jobs:
  analyze:
    timeout-minutes: 20
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          # security-extended adds security queries; findings still need review.
          # Choose per-repo by the precision-vs-coverage tradeoff.
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.language }}"
